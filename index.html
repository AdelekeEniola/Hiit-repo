<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Pop CSS Design</title>
    <link rel="stylesheet" href="modal.css">
</head>

<aside class="Side">
    <p>ss</p>
</aside>
<body>
    

    <header class="header">
        <p>Modal Pop-Up</p>
        <small>
            A modern modal component with overlay, animations, and form handling
        </small>
        <button class="open-modal-btn">Open Modal</button>
    </header>

    <section class="css-concepts-card">
        <h2>CSS Positioning Concepts</h2>
        <p>
            This project demonstrates how CSS positioning works using
            fixed positioning, z-index layering, transforms, and utility classes.
        </p>
    </section>

    <!-- Modal -->
    <div class="modal-form hidden">

        <header>
            <h2>Create New Project</h2>
            <small>Enter project details to get started</small>
        </header>

        <form>

            <label>Project Name</label>
            <input type="text" placeholder="My Awesome Project">

            <label>Description</label>
            <textarea placeholder="Describe your project.."></textarea>

            <label>Category</label>
            <input type="text">

        </form>

        <div class="button-div">
            <button class="cancel-btn" >Cancel</button>
            <button class="create-btn">Create Project</button>
        </div>

    </div>

    <script src="modal.js"></script>

</body>
</html>
