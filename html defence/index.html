<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Banking Dashboard</title>

    <link rel="stylesheet" href="Style.css">
</head>
<body>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">
        <h2>MyBank</h2>

        <ul>
            
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="transaction.html">Transactions</a></li>
            <li><a href="settings.html">Settings</a></li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <header>
            <h1>Dashboard</h1>

            <button id="openModal">New Transaction</button>
        </header>

        <!-- Cards -->
        <section class="cards">

            <div class="card">
                <h3>Total Balance</h3>
                <p>$25,000</p>
            </div>

            <div class="card">
                <h3>Total Savings</h3>
                <p>$12,500</p>
            </div>

            <div class="card">
                <h3>Total Expenses</h3>
                <p>$5,400</p>
            </div>

        </section>

        <!-- Transaction Table -->
        <section class="table-section">

            <h2>Recent Transactions</h2>

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Amount</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>Netflix</td>
                        <td>$20</td>
                        <td>Completed</td>
                    </tr>

                    <tr>
                        <td>Amazon</td>
                        <td>$150</td>
                        <td>Pending</td>
                    </tr>
                </tbody>
            </table>

        </section>

    </main>
</div>

<!-- Modal -->
<div class="modal" id="modal">

    <div class="modal-content">

        <span class="close"><p style="color: red;">&times;</p></span>

        <h2>New Transaction</h2>

        <form>

            <input type="text" placeholder="Transaction Name">

            <input type="number" placeholder="Amount">

            <button type="submit">Submit</button>

        </form>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
