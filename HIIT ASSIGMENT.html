<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HIIT ASSIGMENT - CSS Grid</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background-color: #f0f0f0;
    }

    .grid-container {
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      gap: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    .box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .main-box {
      width: 100%;
      height: 150px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
      font-weight: bold;
    }

    .sub-box {
      width: 80%;
      height: 60px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .red { background-color: #e74c3c; }
    .blue { background-color: #2980b9; }
    .yellow { background-color: #f1c40f; color: #333; }

    .red-sub { background-color: #c0392b; }
    .blue-sub { background-color: #1a5276; }
    .yellow-sub { background-color: #d4ac0d; color: #333; }
  </style>
</head>
<body>
  <div class="grid-container">
    <div class="box">
      <div class="main-box red">Red</div>
      <div class="sub-box red-sub">Box 1</div>
    </div>
    <div class="box">
      <div class="main-box blue">Blue</div>
      <div class="sub-box blue-sub">Box 2</div>
    </div>
    <div class="box">
      <div class="main-box yellow">Yellow</div>
      <div class="sub-box yellow-sub">Box 3</div>
    </div>
  </div>
</body>
</html>
